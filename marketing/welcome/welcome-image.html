<!doctype html>
<!--
  marketing/welcome/welcome-image.html: the header image of the welcome WhatsApp (kalmea_owner_welcome).
  An illustration, not a photo of a real person: a smiling cosmetician drawn in the Kalmea palette, with the
  features in circles around her. Rendered to public/media/kalmea-welcome-whatsapp.png by render.sh (headless Edge).
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --green:#1F3A30; --cream:#FBF8F1; --pink:#E9A9A1; --petal:#FBEDE9; --sage:#DCE4D5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1080px; background:var(--cream); overflow:hidden; }
  body { position:relative; font-family:'Assistant', sans-serif; color:var(--green); }
  .wash { position:absolute; border-radius:50%; }
  h1 { position:absolute; top:62px; left:0; right:0; text-align:center; font-family:'Frank Ruhl Libre', serif;
       font-weight:700; font-size:66px; line-height:1.1; }
  h1 .not { color:var(--pink); }
  .sub { position:absolute; top:150px; left:0; right:0; text-align:center; font-size:34px; font-weight:600; opacity:.85; }
  .hero { position:absolute; left:390px; top:410px; width:300px; height:300px; border-radius:50%;
          background:var(--petal); border:6px solid #fff; box-shadow:0 18px 50px rgba(31,58,48,.12); overflow:hidden; }
  .feat { position:absolute; width:200px; text-align:center; }
  .feat .c { width:112px; height:112px; margin:0 auto; border-radius:50%; background:#fff; border:4px solid var(--sage);
             display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px rgba(31,58,48,.10); }
  .feat .c svg { width:70px; height:70px; stroke:var(--green); fill:none; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
  .feat .c .acc { stroke:var(--pink); }
  .feat .l { margin-top:8px; font-size:24px; font-weight:700; line-height:1.15; }
  .foot { position:absolute; bottom:26px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:14px; }
  .foot img.mark { height:60px; }
  .foot img.flower { height:44px; }
</style>
</head>
<body>
  <div class="wash" style="width:680px;height:680px;left:200px;top:220px;background:var(--sage);opacity:.45"></div>
  <div class="wash" style="width:260px;height:260px;left:-80px;top:-70px;background:var(--petal)"></div>
  <div class="wash" style="width:200px;height:200px;right:-60px;bottom:120px;background:var(--petal)"></div>

  <h1>זו <span class="not">לא</span> עוד מערכת לקביעת תורים</h1>
  <div class="sub">אלא העוזרת האישית של העסק שלך</div>

  <!-- the cosmetician: flat illustration, invented, no real person -->
  <div class="hero">
    <svg viewBox="0 0 400 400" width="300" height="300">
      <circle cx="200" cy="96" r="44" fill="#3B2A24"/>                          <!-- bun -->
      <path d="M118 190 q0-92 82-92 q82 0 82 92 q0 40-14 70 l-136 0 q-14-30-14-70z" fill="#3B2A24"/> <!-- hair -->
      <rect x="176" y="232" width="48" height="50" rx="20" fill="#E8BFA6"/>       <!-- neck -->
      <ellipse cx="200" cy="186" rx="64" ry="74" fill="#F1CDB6"/>                <!-- face -->
      <path d="M136 168 q10-62 64-66 q54 4 64 66 q-26-34-64-38 q-38 4-64 38z" fill="#3B2A24"/> <!-- fringe -->
      <path d="M168 182 q10-10 20 0" stroke="#3B2A24" stroke-width="4.5" fill="none" stroke-linecap="round"/> <!-- eyes, smiling -->
      <path d="M212 182 q10-10 20 0" stroke="#3B2A24" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="160" cy="210" r="13" fill="#E9A9A1" opacity=".55"/>            <!-- blush -->
      <circle cx="240" cy="210" r="13" fill="#E9A9A1" opacity=".55"/>
      <path d="M180 222 q20 20 40 0" stroke="#B0504A" stroke-width="5" fill="none" stroke-linecap="round"/> <!-- smile -->
      <path d="M70 400 q8-110 98-124 l32 26 l32-26 q90 14 98 124z" fill="#FFFFFF"/> <!-- tunic -->
      <path d="M168 276 l32 26 l32-26" stroke="#DCE4D5" stroke-width="6" fill="none"/>
      <circle cx="262" cy="330" r="9" fill="#E9A9A1"/>                           <!-- small flower pin -->
      <circle cx="262" cy="330" r="3.5" fill="#1F3A30"/>
      <!-- a brush in her hand -->
      <path d="M296 400 l34-96" stroke="#1F3A30" stroke-width="10" stroke-linecap="round"/>
      <path d="M326 312 q10-30 4-46 q-18 12-16 40z" fill="#E9A9A1"/>
    </svg>
  </div>

  <!-- eight features on an ellipse around her; placed by the script below (RTL: the first is top right) -->
  <div id="ring">
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="40" rx="6"/><path d="M10 26h44M22 8v10M42 8v10"/><path class="acc" d="M24 40l6 6 12-12"/></svg></div><div class="l">תורים אונליין<br>24/7</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><path d="M32 8a24 24 0 0 0-21 35.5L8 56l12.8-3.2A24 24 0 1 0 32 8z"/><path class="acc" d="M24 30l6 6 11-11"/></svg></div><div class="l">תזכורות אוטומטיות<br>בוואטסאפ</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z"/><path class="acc" d="M46 14l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/></svg></div><div class="l">"מחר שלך"<br>בהודעה בערב</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><rect x="8" y="16" width="48" height="32" rx="6"/><path d="M8 26h48"/><path class="acc" d="M16 38h12"/></svg></div><div class="l">סליקה<br>ותשלומים</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><rect x="8" y="14" width="48" height="36" rx="6"/><circle class="acc" cx="24" cy="30" r="6"/><path class="acc" d="M15 43q9-9 18 0"/><path d="M38 26h12M38 34h12M38 42h8"/></svg></div><div class="l">כרטיס לקוחה</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><path d="M14 22V14h8M42 14h8v8M50 42v8h-8M22 50h-8v-8"/><circle class="acc" cx="32" cy="32" r="10"/></svg></div><div class="l">סורק עור<br>שהופך לליד</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><rect x="16" y="8" width="32" height="48" rx="7"/><path class="acc" d="M28 24l12 8-12 8z"/></svg></div><div class="l">רילס בהתאמה<br>אישית</div></div>
    <div class="feat"><div class="c"><svg viewBox="0 0 64 64"><path d="M10 14h44v28H30l-12 10V42h-8z"/><path class="acc" d="M32 20l2.5 5.5L40 28l-5.5 2.5L32 36l-2.5-5.5L24 28l5.5-2.5z"/></svg></div><div class="l">יועץ עסקי<br>AI</div></div>
  </div>
  <script>
    // Centre of the ring and its radii, in page pixels. 8 positions, 45deg apart, starting 22.5deg right of the top,
    // so nothing sits under the title or on the wordmark. Each .feat is 200px wide, its circle 112px.
    const CX = 540, CY = 560, RX = 400, RY = 300;
    document.querySelectorAll('#ring .feat').forEach((el, i) => {
      const a = (22.5 + 45 * i) * Math.PI / 180;
      const x = CX + RX * Math.sin(a), y = CY - RY * Math.cos(a);
      el.style.left = (x - 100) + 'px';
      el.style.top = (y - 56) + 'px';
    });
  </script>

  <div class="foot">

    <img class="mark" src="kalmea-wordmark.png" alt="קלמיה">
  </div>
</body>
</html>
