# .github/workflows/ci.yml
#
# The point of this file is that a check nobody runs is not a check.
#
# Before it, six test files existed and executed only when somebody typed a
# filename. Three of them had been failing to load for some time - running zero
# assertions while looking like coverage - and a fourth broke mid-session
# without anyone noticing, because `next build` stayed green. The build compiles
# TypeScript. It has never meant the code works.
#
# So: on every push and every pull request, the suite runs and the types are
# checked, and a failure is loud and attached to the commit that caused it.
#
# That still left one gap: this workflow is CI, not the deploy path. Vercel's
# own build runs `npm run build` directly, on push to main, with no dependency
# on this file passing — a red run here was a red badge, not a blocked
# deploy. It stayed a gap until a broken test file passed CI-that-nobody-
# gated and then built and deployed anyway, silently, for hours. Fixed at the
# source, not by trying to police Vercel from outside it: `npm run build`
# itself now runs `npm test` first (see package.json's "//build"), so the
# deploy command Vercel actually calls fails outright on a red suite. The
# "Tests" and "Build" steps below both run the suite as a result — a few
# extra seconds of CI time for a clearer, separately-attributed failure
# message than the Build step catching it alone.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel project's Node version. The suite relies on
          # --experimental-strip-types to run the .ts tests directly, which
          # needs 22.6+; the repo builds on 24.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Types first: it is the faster of the two and its failures are usually
      # the clearer ones.
      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # The check that found the render-time crash. Placeholder credentials are
      # deliberately unusable: they let modules construct so the pages can be
      # rendered, and any real call made with them fails rather than reaching a
      # live database from CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

# ── Deliberately NOT here, and why ─────────────────────────────────────────
#
# `npm run lint` — eslint currently reports 33 errors, all pre-existing
# (unescaped quotes in JSX, a setState-in-effect, an access-before-declaration).
# Gating on it today would mean a permanently red pipeline that everybody learns
# to ignore, which is worse than no pipeline. Turn it on in the same change that
# clears them, not before.
#
# `npm run lint` is the only thing still ungated. The build IS gated now: the
# initialisation-order bug it found on its first successful run has been fixed,
# and placeholder credentials are enough to get through both page data
# collection and static export.
